# Enable only after the existing zgmf site is moved off port 80 and tested.
# current points to a complete website release prepared by the deploy account.
server {
    listen 80;
    server_name 81.70.80.234;

    root /var/www/hebutxjkt-centre/current;
    index index.html;

    # Assets have stable filenames, so browsers should revalidate after edits.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
